# OpenOCD config for debugging the TC66 (GD32F150G8, Cortex-M3) via a
# Pico-as-debugprobe (CMSIS-DAP). Wiring: SWCLK=GP2, SWDIO=GP3, GND common.
# Flash is RDP-locked (we program via the meter's bootloader, not OpenOCD) — this
# config is for HALT / STEP / read regs+SRAM only.

adapter driver cmsis-dap
transport select swd
adapter speed 1000

set _CHIPNAME gd32
swd newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# No NRST wired -> soft reset via SYSRESETREQ (resets whole chip; bootloader re-runs).
cortex_m reset_config sysresetreq

# Don't let OpenOCD poke flash on connect.
gdb_memory_map disable
gdb_flash_program disable

init
