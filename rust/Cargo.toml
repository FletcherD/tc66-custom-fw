[package]
name = "tc66-fw"
version = "0.1.0"
edition = "2021"

[features]
# Both on by default; drop them (--no-default-features, or default-features
# with a subset) if flash space is ever needed. Gated verbs match and
# silently do nothing when disabled.
# - pcprf: the TIMER5-veneer PC profiler (ina.rs) + its `pcprf` dump verb
#   (without it TIMER5_DAC branches straight to the tick body).
# - dev-verbs: the bring-up/debug verbs (i2crd adcrd clkrd keyrd rstrd
#   wdtst uiscr tftfl tftbl tftui btini btcmd btget btrun btsta btspy). query/getva/rawva/updat are the product protocol - never gated.
# - grace: the 10 s boot grace window (pseudo-bootloader escape hatch:
#   query/updat only, sampler deferred — power-cycle + `make flash` recovers
#   without K1). OFF by default since build 98; build `--features grace` when
#   bringing up risky new always-on code. Without it a boot-path fault needs
#   K1 + `make recover`.
default = ["pcprf", "dev-verbs"]
pcprf = []
dev-verbs = []
grace = []

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
stm32-usbd = "0.8"
usb-device = "0.3"
usbd-serial = "0.2"
# set-sp: Reset loads MSP from _stack_start (0x20000e40) before anything else.
# set-vtor is deliberately OFF: VTOR is set inside __pre_init AFTER cpsid i, so a
# bootloader-armed pending IRQ can never land in our spinning DefaultHandler.
cortex-m-rt = { version = "0.7.6", features = ["set-sp"] }
# rt: the PAC supplies the 52-entry device vector table + #[interrupt]
# (cortex-m-rt "device" feature) so USBD_LP lands in slot 37 and TIMER5_DAC
# in its slot; unhandled IRQs still land in our asm DefaultHandler via
# device.x PROVIDEs. All other IRQs stay masked.
gd32f1 = { version = "0.9.2", features = ["gd32f150", "critical-section", "rt"] }
aes = "0.8"
libm = "0.2"

# opt "s" + fat LTO (was the conservative opt-level 1 / no LTO, kept for the C
# reference's unexplained -Os post-enumeration lockup): −13.9 KB flash, +400 B
# stack headroom, bench-validated 2026-08-26 as build 82 — smoke + before/after
# latency (powerz/query/rawva/getva all improved), concurrent powerz+CDC soak,
# two cold-boot enumeration cycles, self-updat. inline(never) on the USB path
# still holds per-function frames, so MK_PROBE stays meaningful.
[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "abort"
debug = true

# Pure-compute crypto, no USB-path code: at opt-level 1 the fixsliced AES makes
# a getva reply cost ~64 ms (blocks the polled sampler); at 3 it's ~2 ms.
# (Briefly ran at "s" for flash space — the nightly size build made that
# unnecessary.)
[profile.release.package.aes]
opt-level = 3

[profile.dev]
panic = "abort"
