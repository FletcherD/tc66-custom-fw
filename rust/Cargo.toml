[package]
name = "tc66-fw"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.9"
stm32-usbd = "0.8"
usb-device = "0.3"
usbd-serial = "0.2"
# set-sp: Reset loads MSP from _stack_start (0x20000e40) before anything else.
# set-vtor is deliberately OFF: VTOR is set inside __pre_init AFTER cpsid i, so a
# bootloader-armed pending IRQ can never land in our spinning DefaultHandler.
cortex-m-rt = { version = "0.7.6", features = ["set-sp"] }

# The C reference ships usb.c at -O0 because -Os inlining caused a post-enumeration
# lockup (reference-c/Makefile). opt-level=1 + inline(never) on the USB path keeps
# per-function frames so MK_PROBE stays meaningful.
[profile.release]
opt-level = 1
codegen-units = 1
lto = false
panic = "abort"
debug = true

[profile.dev]
panic = "abort"
