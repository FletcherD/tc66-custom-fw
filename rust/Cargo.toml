[package]
name = "tc66-fw"
edition = "2021"

[features]
# The default set is the RELEASE build (`make release`): the product protocol
# (powerz, getva/rawva/query/updat/cfgrd/cfgwr/gtrec/eeprd/versn — never
# gated) plus the charge triggers. The dev loop (`make flash`) adds the
# Makefile's DEV_FEATURES. Gated verbs match and silently do nothing when
# disabled. Flash is tight: enable only the dev groups in current use.
# - triggers: the PD sink + QC/AFC D+/D- trigger and detection verbs (pdctl
#   pdsta pdcap pdinf pdreq qctrg qc3ct qcdet afctr qcoff detct), the PD
#   engine service, the powerz PD capture attribute and the PD info and
#   charger detection screens. A granted request RAISES THE OUT
#   VOLTAGE.
# - fcp: the untested Huawei FCP/SCP verbs (fcptr fcprd scptr), ~2.1 KB.
# - dev-board: board debug verbs (i2crd adcrd gpird gpiot clkrd keyrd rstrd
#   wdtst idlrd).
# - dev-bt: BLE bring-up verbs (btini btcmd btget btrun btsta btspy).
# - dev-tft: display bring-up verbs (tftfl tftbl tftui uiscr tftrd).
# - dev-verbs: all four groups above.
# - pcprf: the TIMER5-veneer PC profiler (ina.rs) + its `pcprf` dump verb
#   (without it TIMER5_DAC branches straight to the tick body).
# - grace: the 10 s boot grace window (pseudo-bootloader escape hatch:
#   query/updat only, sampler deferred — power-cycle + `make flash` recovers
#   without K1). OFF by default; build `--features grace` when bringing up
#   risky new always-on code. Without it a boot-path fault needs K1 +
#   `make recover`.
default = ["triggers"]
triggers = []
pcprf = []
fcp = ["triggers"]
dev-board = []
dev-bt = []
dev-tft = []
dev-verbs = ["fcp", "dev-board", "dev-bt", "dev-tft"]
grace = []

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
stm32-usbd = "0.8"
usb-device = "0.3"
usbd-serial = "0.2"
# set-sp: Reset loads MSP from _stack_start (0x20000e40) before anything else.
# set-vtor is deliberately OFF: VTOR is set inside __pre_init AFTER cpsid i, so a
# bootloader-armed pending IRQ can never land in our spinning DefaultHandler.
cortex-m-rt = { version = "0.7.6", features = ["set-sp"] }
# rt: the PAC supplies the 52-entry device vector table + #[interrupt]
# (cortex-m-rt "device" feature) so USBD_LP lands in slot 37 and TIMER5_DAC
# in its slot; unhandled IRQs still land in our asm DefaultHandler via
# device.x PROVIDEs. All other IRQs stay masked.
gd32f1 = { version = "0.9.2", features = ["gd32f150", "critical-section", "rt"] }

# opt "s" + fat LTO (was the conservative opt-level 1 / no LTO, kept for the C
# reference's unexplained -Os post-enumeration lockup): −13.9 KB flash, +400 B
# stack headroom, bench-validated 2026-08-26 as build 82 — smoke + before/after
# latency (powerz/query/rawva/getva all improved), concurrent powerz+CDC soak,
# two cold-boot enumeration cycles, self-updat. inline(never) on the USB path
# still holds per-function frames, so MK_PROBE stays meaningful.
[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "abort"
debug = true

[profile.dev]
panic = "abort"
