# Pinned nightly for -Zbuild-std + -Cpanic=immediate-abort (strips the
# ~5.6 KB of runtime-unreachable panic/fmt code+strings that stable cannot).
# Bump the date deliberately; codegen size shifts between nightlies.
[toolchain]
channel = "nightly-2026-08-06"
components = ["rust-src"]
targets = ["thumbv7m-none-eabi"]
