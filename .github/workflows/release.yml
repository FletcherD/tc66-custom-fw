name: Release

# Push a tag vX.Y.Z (matching rust/Cargo.toml's version) to build the release
# feature set, encrypt it for the stock bootloader, and publish it as a
# GitHub release. Flash it with tools/tc66flash.py (see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Install binutils + python deps
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi python3-cryptography
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rust-src --target thumbv7m-none-eabi
      - name: Build release image (all gates run)
        run: |
          make release
          cp tc66fw-release.enc.bin "tc66fw-${GITHUB_REF_NAME}.enc.bin"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(sed -n 's/^const BUILD_ID: u32 = \([0-9]*\);/\1/p' src/main.rs)
          sha=$(sha256sum "tc66fw-${GITHUB_REF_NAME}.enc.bin" | cut -d' ' -f1)
          cat > notes.md <<NOTES
          Firmware ${GITHUB_REF_NAME} (build ${build}) for the RuiDeng TC66 / TC66C.

          Flash it through the meter's stock bootloader (hold K1 while plugging in):

          \`\`\`
          uv run tools/tc66flash.py flash tc66fw-${GITHUB_REF_NAME}.enc.bin
          \`\`\`

          Then back up the meter's EEPROM: \`uv run tools/tc66flash.py backup-eeprom\`.
          See the README for details, going back to stock, and recovery.

          sha256: \`${sha}\`
          NOTES
          gh release create "${GITHUB_REF_NAME}" "tc66fw-${GITHUB_REF_NAME}.enc.bin" \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md
